<g fill="#1c3c40" stroke="#69cdb1"><rect x="839" y="70" width="170" height="74" rx="10"/><rect x="839" y="165" width="170" height="74" rx="10"/><rect x="839" y="260" width="170" height="74" rx="10"/></g>
