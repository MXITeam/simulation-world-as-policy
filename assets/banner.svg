<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
<title id="title">Simulation World as Policy</title><desc id="desc">A schematic of observed reality branching into simulation worlds and returning to closed-loop execution.</desc>
<defs><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#233344" stroke-width=".7"/></pattern><linearGradient id="bg"><stop stop-color="#101c2b"/><stop offset="1" stop-color="#122d33"/></linearGradient></defs>
<rect width="1280" height="420" rx="20" fill="url(#bg)"/><rect width="1280" height="420" rx="20" fill="url(#grid)"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="56" y="65" fill="#84e0c2" font-size="13" letter-spacing="3">RESEARCH PROJECT / CLOSED-LOOP ROBOTICS</text><text x="56" y="132" fill="#f1f6f7" font-size="44" font-weight="700">Simulation World</text><text x="56" y="188" fill="#f1f6f7" font-size="44" font-weight="700">as Policy</text><text x="58" y="234" fill="#b4c8d2" font-size="17">Reconstruct. Search. Execute. Align.</text><path d="M58 274H500" stroke="#44636c"/><text x="58" y="309" fill="#84e0c2" font-size="13" letter-spacing="1.5">TRAIN ASSETS + ONLINE RGB-D</text><text x="58" y="350" fill="#96abb8" font-size="14">A method proposal. Results to be validated.</text>
