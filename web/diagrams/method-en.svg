<svg class="system-diagram" data-phase="2" viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="system-title system-desc">
<title id="system-title">Simulation World as Policy — interaction and search</title>
<desc id="system-desc">RGB-D observations reconstruct a package-sorting scene. Three simulation branches test different trajectories. Failed candidates are rejected; the selected trajectory is executed and observations update the world.</desc>
<style><![CDATA[:root{color-scheme:light;--paper:#f7f6f2;--ink:#252724;--muted:#72766e;--rule:#d8dad2;--accent:#536b56}*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:32px}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;font-size:17px;line-height:1.8;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration-color:#a2a79a;text-underline-offset:5px}a:hover{color:var(--accent)}a:focus-visible{outline:2px solid var(--accent);outline-offset:5px}.site-header{max-width:1056px;margin:0 auto;padding:38px 32px;display:flex;justify-content:space-between;align-items:center;gap:24px}.wordmark{font-family:Georgia,"Times New Roman",serif;font-size:22px;text-decoration:none}.site-header nav{display:flex;gap:25px;font:13px ui-monospace,SFMono-Regular,Consolas,monospace;white-space:nowrap}.prose{max-width:824px;margin-left:auto;margin-right:auto;padding-left:32px;padding-right:32px}.article-title{padding-top:63px}.eyebrow{font:11px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1.6px;color:var(--muted);margin:0 0 21px}h1,h2,h3{font-family:Georgia,"Times New Roman","Songti SC",serif;font-weight:400}h1{font-size:clamp(46px,5.4vw,72px);line-height:1.08;letter-spacing:-2px;margin:0 0 26px}.subtitle{font-size:21px;line-height:1.5;color:#656b61;max-width:650px;margin:0 0 32px}.metadata{font:12px/1.9 ui-monospace,SFMono-Regular,Consolas,monospace;margin:0 0 49px}.metadata div{display:flex;gap:22px}.metadata dt{width:80px;flex-shrink:0;color:var(--muted)}.metadata dd{margin:0}.metadata dd span{color:#a5a99f;margin:0 6px}p{margin:0 0 22px}.introduction{padding-bottom:13px}.wide{max-width:1320px;margin:32px auto 65px;padding:0 30px}.wide>a{display:block}.wide img{display:block;width:100%;height:auto}.wide figcaption{max-width:760px;margin:20px auto 0;font-size:13px;line-height:1.75;color:var(--muted)}figcaption b{font-weight:500;color:var(--ink)}h2{font-size:36px;line-height:1.3;letter-spacing:-.7px;margin:55px 0 24px}h3{font-size:25px;line-height:1.4;margin:32px 0 15px}section.prose{margin-bottom:40px}.table-wrap{overflow-x:auto;margin:30px 0}table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.7;text-align:left}th,td{padding:16px 0;border-bottom:1px solid var(--rule);vertical-align:top}th{font-weight:400}thead th{border-top:1px solid #92998a;color:var(--muted);font:11px/1.5 ui-monospace,monospace;letter-spacing:.3px}th:first-child{width:38%;padding-right:24px}td{color:#5a6055}.source-note{font-size:13px;color:var(--muted)}footer.prose{margin-top:80px;margin-bottom:35px;padding-top:24px;border-top:1px solid var(--rule);display:flex;justify-content:space-between;gap:20px;font-size:11px;color:var(--muted)}.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}html[lang=zh-CN] h1{font-family:Georgia,serif}html[lang=zh-CN] p{line-height:1.95}@media(max-width:700px){body{font-size:16px}.site-header{padding:24px;display:block}.wordmark{font-size:21px}.site-header nav{margin-top:19px;gap:24px;font-size:12px}.prose{padding-left:24px;padding-right:24px}.article-title{padding-top:38px}h1{font-size:49px;letter-spacing:-1.6px}.subtitle{font-size:18px}.metadata{font-size:11px;margin-bottom:34px}.metadata div{gap:12px}.metadata dt{width:65px}.wide{padding:0 12px;margin:24px auto 42px}.wide figcaption{padding:0 12px;font-size:12px}h2{font-size:29px;margin-top:40px}h3{font-size:23px}th:first-child{width:38%;padding-right:15px}table{font-size:12px}footer.prose{margin-top:50px;margin-left:24px;margin-right:24px;padding-left:0;padding-right:0;flex-wrap:wrap}.metadata dd span{margin:0 2px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

/* Article layout and animated diagrams. */
.site-header{max-width:824px;padding-top:42px;padding-bottom:38px}
.wordmark{font-size:25px}
.article-title{padding-top:22px}
h1{font-size:clamp(46px,5.2vw,66px);line-height:1.14}
.subtitle{font-family:Georgia,"Songti SC",serif;font-size:29px}
.metadata{margin-bottom:28px}
.wide{max-width:1084px;margin-top:30px;margin-bottom:54px}
.live-figure{margin-top:28px}
.figure-bar{display:flex;justify-content:space-between;align-items:center;gap:16px;border-top:1px solid var(--rule);padding:14px 0;font:11px ui-monospace,monospace;letter-spacing:.5px;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
.figure-bar button{border:0;background:none;text-decoration:underline;text-underline-offset:4px;padding:6px}
button:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.live-figure svg{display:block;width:100%;overflow:visible}
.node-bg{fill:#eeeee7;stroke:#d3d5ca;transition:fill .5s,stroke .5s}
.world-node.active .node-bg{fill:#e4e9dc;stroke:#728265}
.node-number{font:11px ui-monospace,monospace;fill:#7c8175}
.node-title{font:21px Georgia,"Songti SC",serif;fill:var(--ink)}
.node-sub{font:12px Arial,"PingFang SC",sans-serif;fill:#747a6c}
.line-art{fill:none;stroke:#596650;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.flow{fill:none;stroke:#7c8a6e;stroke-width:1.8;stroke-dasharray:5 6;animation:flow 1.6s linear infinite}
.chosen{stroke:#455c38;stroke-width:3}
.robot-arm{transform-box:fill-box;transform-origin:0% 100%;animation:reach 4.8s ease-in-out infinite}
.scan-line{stroke:#8f9e7e;animation:scan 3s ease-in-out infinite}
.pulse-point{fill:#6d835b;animation:pulse 2.4s ease-in-out infinite}
.step-nav,.scene-tabs{display:flex;justify-content:center;gap:24px;border-bottom:1px solid var(--rule);padding:4px 0 14px}
.step-nav button,.scene-tabs button{background:none;border:0;border-bottom:1px solid transparent;padding:8px 0;font:12px ui-monospace,"PingFang SC",monospace;color:var(--muted)}
.step-nav button[aria-pressed=true],.scene-tabs button[aria-selected=true]{border-color:var(--ink);color:var(--ink)}
.live-figure figcaption{text-align:center}
.scene-panel{background:#eeeee7}
.scene-panel[hidden]{display:none}
.scene-panel img{height:410px;object-fit:contain;background:#e9e9e2}
.scene-panel p{padding:14px 20px;font-size:13px;margin:0;color:var(--muted)}
.scene-tabs{justify-content:flex-start;padding:12px 0;gap:30px}
.case-viewer figcaption{margin-left:0}
.paused *,.offscreen *{animation-play-state:paused!important}
@keyframes flow{to{stroke-dashoffset:-22}}
@keyframes reach{0%,100%{transform:rotate(0)}45%,60%{transform:rotate(12deg)}}
@keyframes scan{0%,100%{transform:translateY(-15px)}50%{transform:translateY(20px)}}
@keyframes pulse{50%{opacity:.35}}
@media(max-width:700px){.site-header{padding:24px}.article-title{padding-top:24px}.subtitle{font-size:23px}.wide{padding:0 20px}.figure-bar{font-size:9px}.step-nav{gap:12px;flex-wrap:wrap}.step-nav button{font-size:10px}.live-figure svg{min-width:600px}.live-figure{overflow-x:auto}.scene-panel img{height:250px}.scene-panel p{padding:12px;font-size:12px}.live-figure figcaption{text-align:left}.wordmark{font-size:23px}}
@media(prefers-reduced-motion:reduce){.live-figure *{animation:none!important;transition:none!important}}
@media(max-width:700px){.live-figure svg{min-width:0}.live-figure svg>.flow,.live-figure svg>.node-sub{display:none}.live-figure{overflow:visible}}
/* Continuous interaction-world diagram */
.live-figure{max-width:1260px}
.diagram-scroll{width:100%;overflow-x:auto;overscroll-behavior-inline:contain}
.live-figure .system-diagram{width:100%;min-width:1000px;display:block;overflow:hidden}
.system-diagram text{font-family:Arial,"PingFang SC",sans-serif}
.system-diagram .section-title{font-family:Georgia,"Songti SC",serif;font-size:21px;fill:#353d30}
.system-diagram .diagram-kicker,.system-diagram .micro{font:10px ui-monospace,"PingFang SC",monospace;letter-spacing:.55px;fill:#808775}
.system-diagram .small-title{font-size:14px;fill:#3e4936}
.system-diagram .note{font-size:12px;fill:#7d8474}
.section-rule{stroke:#cbd0c2;fill:none;stroke-width:1}
.connector{fill:none;stroke:#9ba68f;stroke-width:1.25;marker-end:url(#tip)}
.branch-bg{fill:transparent;stroke:#d3d8ca;stroke-width:1}
.branch-status{font:11px Arial,sans-serif;fill:#7e8477}
.trial-path{stroke:#8c9f7e;stroke-dashoffset:0}
.verdict{stroke:#9b8875;opacity:0}
.selected .verdict{stroke:#647f51}
.pose-frame{opacity:.45}
.execution-path,.chosen-link{opacity:.18}
.moving-parcel{transform:translate(108px,65px) scale(.65)}
.depth-scan{opacity:.3}
.diagram-footer{border-top:1px solid var(--rule);padding:16px 0 0;display:flex;justify-content:space-between;gap:20px;font:11px ui-monospace,"PingFang SC",monospace;color:#818776}
.diagram-phase{color:#536449}
.live-figure figcaption{display:none}
[data-phase="0"] .pose-frame{animation:reconstruct 3s ease-in-out infinite}
[data-phase="0"] .depth-scan{animation:scan-depth 3s ease-in-out infinite}
[data-phase="1"] .trial-path{animation:trajectory 1s linear infinite}
[data-phase="1"] .branch-bg{stroke:#9ba98e}
[data-phase="2"] .rejected{opacity:.38;transition:opacity .8s}
[data-phase="2"] .verdict,[data-phase="3"] .verdict{opacity:1}
[data-phase="2"] .selected .branch-bg,[data-phase="3"] .selected .branch-bg{fill:#eaf0e2;stroke:#82956f}
[data-phase="2"] .selected .branch-status,[data-phase="3"] .selected .branch-status{fill:#526d40}
[data-phase="2"] .chosen-link,[data-phase="3"] .chosen-link{opacity:1;stroke:#728962}
[data-phase="3"] .rejected{opacity:.38}
[data-phase="3"] .execution-path{opacity:1;animation:trajectory 1s linear infinite}
[data-phase="3"] .moving-parcel{animation:transfer 3s ease-in-out infinite}
[data-phase="3"] .feedback-path{stroke:#748c64;stroke-dasharray:4 5;animation:trajectory 1s linear infinite}
@keyframes trajectory{to{stroke-dashoffset:-20}}
@keyframes reconstruct{0%{opacity:.15}60%,100%{opacity:1}}
@keyframes scan-depth{0%{transform:translateY(-45px);opacity:.2}50%{opacity:1}100%{transform:translateY(45px);opacity:.2}}
@keyframes transfer{0%,12%{transform:translate(108px,65px) scale(.65)}45%{transform:translate(146px,20px) scale(.65)}85%,100%{transform:translate(182px,111px) scale(.65)}}
@media(max-width:700px){.live-figure{padding:0 20px}.live-figure .system-diagram{min-width:940px}.diagram-footer{flex-direction:column;gap:8px}.diagram-scroll{border-right:1px solid var(--rule)}}
@media(max-width:700px){
 .live-figure .system-diagram{min-width:0;width:100%}
 .diagram-scroll{border:0;overflow:visible}
 .system-diagram .diagram-headings,.system-diagram>.note,.system-diagram>rect,.system-diagram .fork{display:none}
 .system-diagram .small-title{font-size:16px}
 .system-diagram .note{font-size:14px}
 .system-diagram .micro{font-size:12px}
}
